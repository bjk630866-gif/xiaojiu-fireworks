<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090f20">
  <meta name="description" content="放学啦，送你一场小烟花，小九。">
  <meta name="robots" content="noindex,nofollow">
  <title>送你一场小烟花</title>
  <style>
    :root{color-scheme:dark;--ink:#fff1dc}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090f20}
    body{font-family:"Songti SC","STSong","SimSun",serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
    main{position:relative;width:100%;height:100%;height:100svh;isolation:isolate;background:radial-gradient(ellipse at 50% 115%,#24243d 0,transparent 63%),linear-gradient(#090f20,#10182d 72%,#1e2037)}
    #sky{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
    .horizon{position:absolute;inset:auto 0 0;height:12%;pointer-events:none;background:linear-gradient(transparent,rgba(9,15,32,.32));z-index:1}
    .words{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;padding:0 18px 4vh;z-index:2}
    .line{grid-area:1/1;text-align:center;white-space:nowrap;font-size:clamp(24px,5.9vw,38px);font-weight:400;line-height:1.8;letter-spacing:.13em;opacity:0;filter:blur(6px);transform:translateY(7px);text-shadow:0 0 24px #f6cf9d44;transition:opacity 1.7s ease,filter 1.7s ease,transform 1.7s ease}
    .line.visible{opacity:1;filter:blur(0) drop-shadow(0 0 10px #dba7fa55);transform:translateY(0)}
    .line:last-child{font-size:clamp(37px,9vw,56px);letter-spacing:.27em;padding-left:.27em}
    @supports ((background-clip:text) or (-webkit-background-clip:text)){
      .line{background-image:linear-gradient(110deg,#ffd58c 0%,#ffa2cf 20%,#c2acff 40%,#8cddff 60%,#9bf2d0 80%,#ffd58c 100%);background-size:260% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;animation:rainbow 7s ease-in-out infinite alternate}
    }
    @keyframes rainbow{from{background-position:0% 50%}to{background-position:100% 50%}}
    #replay{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:3;border:1px solid #d9d7e52b;border-radius:24px;background:#10182d66;color:#d5cbd7;font:12px/1.4 system-ui,sans-serif;letter-spacing:.12em;padding:12px 19px;cursor:pointer;opacity:0;visibility:hidden;transition:opacity 1s ease;touch-action:manipulation}
    #replay.ready{opacity:.7;visibility:visible}
    #replay:hover,#replay:focus-visible{opacity:1;border-color:#e8d4ae99;outline:2px solid #e8d4ae66;outline-offset:4px}
    #replay:disabled{pointer-events:none}
    #sound{position:absolute;top:max(18px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));z-index:3;min-height:44px;padding:10px 18px;border:2px solid transparent;border-radius:24px;background:linear-gradient(110deg,#36214bee,#172c4aee) padding-box,linear-gradient(110deg,#ffd58c,#ffa2cf,#c2acff,#8cddff,#9bf2d0,#ffd58c) border-box;background-size:100% 100%,250% 100%;color:#fff0fb;font:500 13px/1.4 system-ui,sans-serif;letter-spacing:.12em;box-shadow:0 0 16px #c2acff44,0 0 28px #8cddff22;cursor:pointer;touch-action:manipulation;animation:button-colors 6s ease-in-out infinite alternate}
    #sound[aria-pressed="true"]{box-shadow:0 0 20px #ffa2cf66,0 0 34px #8cddff44;color:#fff}
    @keyframes button-colors{from{background-position:0 0,0% 50%}to{background-position:0 0,100% 50%}}
    #sound:focus-visible{outline:2px solid #e8d4ae;outline-offset:4px}
    @media(prefers-reduced-motion:reduce){.line{filter:none;transform:none;transition:opacity 1s ease;animation:none}#sound{animation:none}}
  </style>
</head>

      await music.play();
      enabled = true;
      if (document.hidden) music.pause();
      updateButton();
    } catch { failed(); }
    finally { busy = false; }

    restart() {
      music.currentTime = 0;
      if (enabled && !document.hidden) music.play().catch(failed);
    }

  <script>
(() => {
  'use strict';
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const lines = [...document.querySelectorAll('.line')];
  const replay = document.getElementById('replay');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const colors = ['#ffd49e', '#f5afbe', '#b8c8fa', '#b3e5d3', '#e2b8ec'];
  let width, height, dpr, stars = [], rockets = [], sparks = [];
  let elapsed = 0, previous = null, nextLaunch = 0, launched = 0, activeLine = -1;
  let animationId = null;
  const random = (min, max) => min + Math.random() * (max - min);

  function resize() {
    width = canvas.clientWidth;
    height = canvas.clientHeight;
    dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: Math.min(90, Math.floor(width * height / 6500)) }, () => ({
      x: Math.random() * width, y: Math.random() * height * .88,
      radius: random(.35, 1), alpha: random(.12, .5), phase: random(0, Math.PI * 2)
    }));
  }

  function launch(x, y, first = false) {
    rockets.push({ x, y: height + 8, startY: height + 8, targetY: y, age: 0,
      duration: first ? 1.45 : random(1, 1.45), color: colors[launched++ % colors.length], first });
  }

  function burst(rocket) {
    const count = reducedMotion ? 36 : (rocket.first ? 125 : 75);
    const scale = Math.min(width, height) / 390;
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2 + random(-.06, .06);
      const speed = random(32, rocket.first ? 122 : 95) * scale;
      const life = random(1.3, 2.2);
      sparks.push({ x: rocket.x, y: rocket.y, vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed, age: 0, life, color: rocket.color,
        radius: random(.7, 1.5), trail: [] });
    }
    // Bound work on older phones even when the sky is tapped repeatedly.
    const maxSparks = reducedMotion ? 250 : 1050;
    if (sparks.length > maxSparks) sparks.splice(0, sparks.length - maxSparks);
  }

  function showLine(index) {
    if (activeLine === index) return;
    activeLine = index;
    lines.forEach((line, i) => {
      line.classList.toggle('visible', i === index);
      line.setAttribute('aria-hidden', String(i !== index));
    });
  }

  function updateStory() {
    // Leave a pause after the first bloom has fully scattered.
    if (elapsed >= 4.4 && elapsed < 7.5) showLine(0);
    else if (elapsed >= 7.5 && elapsed < 8.4) showLine(-1);
    else if (elapsed >= 8.4 && elapsed < 11.9) showLine(1);
    else if (elapsed >= 11.9 && elapsed < 12.8) showLine(-1);
    else if (elapsed >= 12.8) showLine(2);
    if (elapsed >= 16 && replay.disabled) {
      replay.disabled = false;
      replay.classList.add('ready');
    }
  }

  function draw(dt) {
    ctx.clearRect(0, 0, width, height);
    for (const star of stars) {
      ctx.globalAlpha = star.alpha * (reducedMotion ? 1 : .8 + .2 * Math.sin(elapsed * .6 + star.phase));
      ctx.fillStyle = '#e1e4f3';
      ctx.beginPath(); ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'lighter';
    for (let i = rockets.length - 1; i >= 0; i--) {
      const rocket = rockets[i];
      rocket.age += dt;
      const t = Math.min(rocket.age / rocket.duration, 1);
      rocket.y = rocket.startY + (rocket.targetY - rocket.startY) * (1 - (1 - t) ** 2);
      ctx.globalAlpha = .7;
      const tail = ctx.createLinearGradient(rocket.x, rocket.y, rocket.x, rocket.y + 42);
      tail.addColorStop(0, rocket.color); tail.addColorStop(1, 'transparent');
      ctx.strokeStyle = tail; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(rocket.x, rocket.y); ctx.lineTo(rocket.x, rocket.y + 42); ctx.stroke();
      ctx.fillStyle = '#fff5df';
      ctx.beginPath(); ctx.arc(rocket.x, rocket.y, 1.8, 0, Math.PI * 2); ctx.fill();
      if (t === 1) { burst(rocket); rockets.splice(i, 1); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.age += dt;
      if (p.age >= p.life) { sparks.splice(i, 1); continue; }
      p.trail.push([p.x, p.y]);
      if (p.trail.length > 5) p.trail.shift();
      const drag = Math.exp(-.85 * dt);
      p.vx *= drag; p.vy = p.vy * drag + 24 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalAlpha = Math.pow(1 - p.age / p.life, 1.5) * .88;
      ctx.strokeStyle = p.color; ctx.fillStyle = p.color; ctx.lineWidth = p.radius * .7;
      ctx.beginPath(); ctx.moveTo(p.trail[0][0], p.trail[0][1]);
      for (const [x, y] of p.trail) ctx.lineTo(x, y);
      ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function frame(now) {
    const dt = previous === null ? 0 : Math.min((now - previous) / 1000, .05);
    previous = now;
    elapsed += dt;
    if (elapsed >= nextLaunch) {
      const first = launched === 0;
      if (first) {
        launch(width * .5, height * .23, true);
        if (!reducedMotion) {
          launch(width * .23, height * .34);
          launch(width * .77, height * .31);
        }
      } else {
        const count = reducedMotion ? 1 : Math.floor(random(2, 5));
        for (let i = 0; i < count; i++) {
          // Spread each wave across the sky, leaving the words clear below.
          const x = width * (.12 + .76 * ((i + random(.2, .8)) / count));
          launch(x, random(height * .12, height * .39));
        }
      }
      nextLaunch = first ? 5.5 : elapsed + (reducedMotion ? 5 : random(.85, 1.5));
    }
    updateStory();
    draw(dt);
    animationId = requestAnimationFrame(frame);
  }

  function restart() {
    window.fireworkMusic?.restart();
    elapsed = 0; previous = null; nextLaunch = 0; launched = 0;
    rockets = []; sparks = [];
    showLine(-1);
    replay.disabled = true;
    replay.classList.remove('ready');
  }
  replay.addEventListener('click', restart);
  canvas.addEventListener('pointerdown', event => {
    if (elapsed < 4.4 || rockets.length >= 3) return;
    const box = canvas.getBoundingClientRect();
    const x = Math.max(width * .08, Math.min(width * .92, event.clientX - box.left));
    launch(x, Math.max(height * .1, Math.min(height * .4, event.clientY - box.top)));
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      cancelAnimationFrame(animationId);
      animationId = null;
    } else if (animationId === null) {
      previous = null;
      animationId = requestAnimationFrame(frame);
    }
  });
  window.addEventListener('resize', resize);
  resize();
  animationId = requestAnimationFrame(frame);
})();

</script>
</body>
</html>
